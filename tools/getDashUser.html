  <body>
    <h1>Get Dash User 0.4</h1>
    <p>User Id: <input type="number" id="userId"><button onclick="load()">Load</button></p>
    <p>Method: <button onclick="document.getElementById('userId').type = 'number'">ID</button><button onclick="document.getElementById('userId').type = 'text'">USERNAME</button></p>
    <div id="root" class="messages">Loading...</div>
  </body>
  <script>
    class Acievement {
      constructor (meta) {
        this.type = meta.type
        this.date = new Date(meta.date)
        this.meta = meta
      }

      render () {
        switch (this.type) {
          case 'first-project':
            return `
              <b>First project</b><br>
              User created first project "<a href="https://dashblocks.org/#${this.meta.project.id}">${this.meta.project.name}</a>"<br>
              ${this.date.toISOString()}<br>
            `
          case 'reached-followers-count':
            return `
              <b>${this.meta.count} Followers Reached</b><br>
              ${this.date.toISOString()}<br>
            `
          default:
            return `
              <b>Unknown type</b><br>
              ${this.date.toISOString()}<br>
            `
        }
      }
    }
    class Link {
      constructor (meta) {
        this.link = meta.link || "https://example.com"
        this.label = meta.label || "Link"
        this.type = (this.link.startsWith("https://github.com") || this.link.startsWith("github.com") || this.link.startsWith("http://github.com")) ? "github" : (
          (this.link.startsWith("https://scratch.mit.edu") || this.link.startsWith("scratch.mit.edu") || this.link.startsWith("http://scratch.mit.edu")) ? "scratch" : (
            (this.link.startsWith("https://dashblocks.org") || this.link.startsWith("dashblocks.org")) ? "dash" : "unknown"
          )
        )
      }
      render () {
        switch (this.type) {
          case 'github':
            return `
              <a href="${this.link}"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Octicons-mark-github.svg/1280px-Octicons-mark-github.svg.png" width="10" height="10">${this.label}</a>
            `
          case 'scratch':
            return `
              <a href="${this.link}"><img src="https://scratch-craft-2.github.io/files/img/scratch.svg" width="10" height="10">${this.label}</a>
            `
          case 'dash':
            return `
              <a href="${this.link}"><img src="https://dashblocks.org/favicon.ico" width="10" height="10">${this.label}</a>
            `
          default:
            return `
              <a href="${this.link}">${this.label}</a>
            `
        }
      }
    }
    let metadata = undefined;
    const url = new URL(window.location)
    const sp = url.searchParams
    if (sp.get("id")) {
      document.getElementById('userId').value = sp.get('id')
      load()
    }
    let root = document.getElementById('root')
    let verified = {
      7: 'official, Creator of this tool, Junior Dash Developer',
      8: 'official',
      9: 'official',
      15: 'official, Dash creator, Main developer dash',
      17: 'official',
      18: 'official, Dash developer',
      20: 'official, Scratch_Craft_2, Junior Dash Developer',
      21: 'official, MiCloud Creator',
      22: 'official',
      28: 'official',
      66: 'Tenge Fun',
      67: 'bad meme',
      68: 'Mr. Eat fun'
    }
    async function load() {
      let uid = document.getElementById('userId').value
      let metadata = undefined;
      let root = document.getElementById('root');
      async function getMeta() {
        metadata = await fetch(`https://shaman2016-trampline.vercel.app/dash/users/${uid}`)
        metadata = await metadata.json()
      };
      async function getUserData() {
        await getMeta();
        function getDate(st) {
          if (st === null) {
            return "date not specified"
          } else {
            return new Date(st).toLocaleDateString()
          }
        }
        function getDesc() {
          if (metadata.user.role === 'dasher') {
            return 'User is not Dasher+'
          } else if (metadata.user.profile.description === '') {
            return '<i>Пусто.</i>'
          } else {
            return metadata.user.profile.description.replaceAll('\n', '<br>').replaceAll(/@([\w-]+)/g, (match, group) => `<a href='?id=${group.replace(/\s/g, '')}'>${match}</a>`)
          }
        }
        let achievements = (metadata.user.profile.achievements).map((data) => new Acievement(data).render())
        let links = (metadata.user.profile.links).map((data) => `${new Link(data).render()}<br>`)
        document.title = `${metadata.user.username} - Get Dash User`
        root.innerHTML = `
          <h1><img src='https://shaman2016-trampline.vercel.app/dashImage/users/avatars/${metadata.user.profile.avatarId}'  width='30' height='30'>${metadata.user.username} (${metadata.user.id}) [${metadata.user.role}, ${verified[metadata.user.id] || 'account not verified'}]</h1>
          <p><b>Joined: ${getDate(metadata.user.joinedAt)}</b> | <b>Last Active: ${getDate(metadata.user.lastActive)}</b></p>
          <p class="description">
            <b>Description</b><br>
            ${getDesc()}<br>
            <b>Achievements</b><br>
            ${achievements}<br>
            <b>Links</b><br>
            ${links}
          </p>
          <div class="projects">
            <img src="https://shaman2016-trampline.vercel.app/dashImage/projects/thumbnails/${metadata.user.profile.recommendedProject.thumbnailId}" width="150" height="130">
            <h4><a href='https://dashblocks.org/scratch-gui/#${metadata.user.profile.recommendedProject.id}'>${metadata.user.profile.recommendedProject.name}</a></h4>
          </div>
          <div class="projects">
            <h2>Projects (${metadata.user.profile.stats.projects}) <a href='https://dashblocks.org/scratch-gui/?user=${metadata.user.username}#169'>all</a></h2>
            <iframe id='projects' src='/tools/getDashProjectByUser?id=${uid}' width="810" height="190"></iframe>
            <p><button onclick='UpdUrl()'>Open projects in this page</button></p>
          </div>
        `
      }
      await getUserData()
    }
    function UpdUrl() {
      window.location.href = document.getElementById('projects').src
    }
  </script>
</html>
